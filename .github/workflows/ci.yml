name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: ["v0.10.4", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - name: Check test backend
        run: shellcheck tests/fake-tour
      - name: Run headless integration test
        run: nvim --headless -i NONE -u tests/minimal_init.lua -l tests/integration.lua
